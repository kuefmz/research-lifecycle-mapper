      "description": "Execute controlled research trials or parameter studies.",
      "exclusions": [
        "\\b(?:not|never|doesn't|don't|cannot|can't|will|plan(?:s|ned)?|todo|future work|hypothetical|example only|might|could|would|may|should)\\b"
      ],
      "heading_exclusions": [
        "\\b(?:future|roadmap|related work|references|bibliography|installation|dependencies|acknowledgments)\\b"
      ],
      "id": "EXP_DOC_EXPLICIT_V2",
      "justification": "An explicit research trial activity together with iteration over controlled conditions; run.py alone is insufficient. Activity/object must have affirmative local-repository scope; contextual and workflow families are unapproved candidates.",
      "layer": "explicit",
      "positive": [
        "\\b(run(?:s|ning)?|execut(?:e|es|ed|ing)|conduct(?:s|ed|ing)?)\\b",
        "\\b(controlled experiments|parameter sweep|research trials|experimental trials)\\b"
      ],
      "required_evidence_fields": [
        "repository",
        "commit",
        "path",
        "content_sha256",
        "start_line",
        "end_line",
        "matched_conditions",
        "url"
      ],
      "scope_exclusions": [
