[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-lifecycle-mapper"
version = "0.3.0"
description = "Deterministic, evidence-preserving research lifecycle classification"
requires-python = "==3.12.*"
dependencies = ["Pygments==2.21.0"]

[project.scripts]
lifecycle-mapper = "lifecycle_mapper.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.3", "mypy==1.18.2", "playwright==1.58.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lifecycle_mapper = ["rules/*.yaml", "ui/*.html", "language_catalog.json", "language_catalog_LICENSE.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["benchmark/synthetic/snapshots"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
files = ["src"]
