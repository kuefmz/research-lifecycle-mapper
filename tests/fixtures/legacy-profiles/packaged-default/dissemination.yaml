{
  "rules": [
    {
      "description": "Communicate or deposit research outputs for external reuse.",
      "exclusions": [
        "\\b(?:not|never|doesn't|don't|cannot|can't|does not|do not|not supported|not implemented|planned|todo|future work|hypothetical|example only)\\b"
      ],
      "id": "DIS_CODE_ACTIVITY_V1",
      "justification": "External publication/deposition of research outputs; README presence and generic software releases do not suffice.",
      "positive": [
        "^\\s*def\\s+(?:deposit_research_dataset|publish_research_results|archive_research_software)\\s*\\(",
        "\\b(?:zenodo\\.deposit|repository\\.publish)\\s*\\("
      ],
      "required_evidence_fields": [
        "repository",
        "commit",
        "path",
        "content_sha256",
        "start_line",
        "end_line",
        "matched_conditions",
        "url"
      ],
      "source": "code",
      "stage": "Dissemination",
      "status": "unadjudicated-candidate",
      "supporting": [],
      "version": "0.1.0-candidate",
      "window_lines": 8
    },
    {
      "command_pattern": "^\\s*(?:\\$\\s*)?[a-z][\\w.-]*\\s+(?:[a-z][\\w./-]*|--[a-z][\\w-]*)",
      "context_pattern": "\\b(?:we|our (?:tool|package|repository|software|library|workflow)|this (?:tool|package|repository|software|library|workflow)|the (?:package|software|repository))\\b",
      "description": "Communicate or deposit research outputs for external reuse.",
      "exclusions": [
        "\\b(?:not|never|doesn't|don't|cannot|can't|will|plan(?:s|ned)?|todo|future work|hypothetical|example only|might|could|would|may|should)\\b"
      ],
      "heading_exclusions": [
        "\\b(?:future|roadmap|related work|references|bibliography|installation|dependencies|acknowledgments)\\b"
      ],
      "id": "DIS_DOC_EXPLICIT_V2",
      "justification": "External publication/deposition of research outputs; README presence and generic software releases do not suffice. Activity/object must have affirmative local-repository scope; contextual and workflow families are unapproved candidates.",
      "layer": "explicit",
      "positive": [
        "\\b(publish(?:es|ed|ing)?|deposit(?:s|ed|ing)?|archiv(?:e|es|ed|ing)|releas(?:e|es|ed|ing))\\b",
        "\\b(research (?:results|dataset|software)|scientific findings)\\b[^\\n]{0,100}\\b(?:doi|zenodo|public repository|journal)\\b"
      ],
      "required_evidence_fields": [
        "repository",
        "commit",
        "path",
        "content_sha256",
        "start_line",
        "end_line",
        "matched_conditions",
        "url"
      ],
      "scope_exclusions": [
        "\\b(?:other|another|external|third[- ]party)\\s+(?:tool|package|repository|library|software)\\b",
        "\\b(?:we|this (?:tool|package|repository))\\s+(?:use|uses|cite|cites|recommend|recommends|invoke|invokes)\\s+[^.!?]{1,100}\\b(?:to|which|that)\\b"
