      ],
      "id": "COL_DOC_EXPLICIT_V2",
      "justification": "A declared raw research acquisition activity plus an acquisition operation; HTTP alone is insufficient. Activity/object must have affirmative local-repository scope; contextual and workflow families are unapproved candidates.",
      "layer": "explicit",
      "positive": [
        "\\b(collect(?:s|ed|ing)?|acquir(?:e|es|ed|ing)|record(?:s|ed|ing)?)\\b",
        "\\b(raw (?:research )?data|research dataset|sensor observations|participant responses)\\b"
      ],
      "required_evidence_fields": [
        "repository",
        "commit",
        "path",
        "content_sha256",
        "start_line",
        "end_line",
        "matched_conditions",
        "url"
      ],
      "scope_exclusions": [
        "\\b(?:other|another|external|third[- ]party)\\s+(?:tool|package|repository|library|software)\\b",
