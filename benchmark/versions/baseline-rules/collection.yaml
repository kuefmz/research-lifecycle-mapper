      "description": "Acquire or generate raw observations for research.",
      "exclusions": [
        "\\b(?:not|never|doesn't|don't|cannot|can't|will|plan(?:s|ned)?|todo|future work|hypothetical|example only|might|could|would|may|should)\\b"
      ],
      "heading_exclusions": [
