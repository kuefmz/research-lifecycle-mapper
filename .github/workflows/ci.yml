name: Offline research verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen
      - run: mkdir -p local
      - run: uv run --frozen ruff check src tests scripts
      - run: uv run --frozen ruff format --check src tests scripts
      - run: uv run --frozen mypy
      - run: uv run --frozen pytest -q --basetemp local/pytest
      - run: uv run --frozen playwright install --with-deps chromium
      - run: RLM_BROWSER_TEST=1 uv run --frozen pytest -q tests/browser --basetemp local/browser-tests
      - run: uv run --frozen python -m lifecycle_mapper benchmark verify --config configs/synthetic.yaml --workspace local/ci-reproduction --reference benchmark/results/synthetic-v2
